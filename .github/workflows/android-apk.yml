name: Build Android APK

# Builds an installable debug APK in the cloud. No Android Studio needed.
# Run it from the GitHub "Actions" tab (Run workflow), or it runs on every push to main.
#
# One-time setup: Settings > Secrets and variables > Actions > Secrets > New repository secret
#   Name: OPENROUTER_API_KEY   Value: your OpenRouter key (sk-or-...)
#   Optional repo variable AI_MODEL (default openrouter/free)
# POC note: the key is baked into the APK. Share the APK only with people you trust.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Check OpenRouter key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY secret is not set. The APK will build, but AI features will say 'not available in this build'."
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build web app
        run: npm run build:web
        env:
          VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VITE_AI_MODEL: ${{ vars.AI_MODEL }}
          VITE_AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}

      - name: Sync Capacitor
        run: npx cap sync android

      # The gradle-wrapper.jar in the original export is corrupt, so install Gradle directly instead of ./gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: indian-money-code-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
